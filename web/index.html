<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Workforce</title>
<style>
/* ---------------------------------------------------------------------------
   macOS-flavoured foundation. Values from docs/apple-style-reference.md, which
   records provenance per value. No Apple assets here -- the font-family keyword
   asks the machine for what it already has; we ship nothing of theirs.

   Two deliberate deviations from Apple's own defaults, both for contrast:
   their secondaryLabel is 3.95:1 and white-on-system-blue is 3.5:1, and both
   are under the 4.5:1 floor. On a product that is entirely a status board,
   copying a contrast failure faithfully would be a stupid way to fail.
--------------------------------------------------------------------------- */
:root {
  --font-ui: -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, monospace;

  --text-title-1: 22px/26px; --text-title-3: 15px/20px;
  --text-body: 13px/16px;    --text-callout: 12px/15px;
  --text-subhead: 11px/14px; --text-caption: 10px/13px;

  --space-2: 4px;  --space-3: 6px;  --space-4: 8px;
  --space-5: 12px; --space-6: 16px; --space-7: 20px; --space-8: 24px;

  --radius-card: 10px; --radius-control: 6px; --radius-pill: 100px;

  /* Light */
  --bg:            #ffffff;
  --bg-elevated:   #ffffff;
  --bg-sunken:     #f5f5f7;
  --label:         rgba(0,0,0,0.85);
  --label-2:       rgba(0,0,0,0.60);   /* 0.60 not Apple's 0.498, to clear AA */
  --label-3:       rgba(0,0,0,0.42);
  --separator:     rgba(0,0,0,0.12);
  --border-strong: rgba(0,0,0,0.22);
  --shadow-card:   0 1px 2px rgba(0,0,0,0.06), 0 1px 6px rgba(0,0,0,0.04);
  --attn-bg:       rgba(0,0,0,0.035);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:            #1c1c1e;
    --bg-elevated:   #2c2c2e;
    --bg-sunken:     #141416;
    --label:         rgba(255,255,255,0.92);
    --label-2:       rgba(255,255,255,0.62);
    --label-3:       rgba(255,255,255,0.42);
    --separator:     rgba(255,255,255,0.14);
    --border-strong: rgba(255,255,255,0.26);
    --shadow-card:   0 1px 3px rgba(0,0,0,0.5);
    --attn-bg:       rgba(255,255,255,0.055);
  }
}
@media (prefers-contrast: more) {
  :root { --label-2: rgba(0,0,0,0.78); --separator: rgba(0,0,0,0.3); }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font: var(--text-body) var(--font-ui);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.006em;
  background: var(--bg-sunken); color: var(--label);
  padding: var(--space-8) var(--space-8) 64px;
}

header { display: flex; justify-content: space-between; align-items: baseline;
         gap: var(--space-7); margin-bottom: var(--space-2); }
h1 { font: 600 var(--text-title-1) var(--font-ui); letter-spacing: -0.012em; }
.checked { font: var(--text-caption) var(--font-ui); color: var(--label-3);
           text-align: right; text-transform: uppercase; letter-spacing: 0.05em; }
.checked strong { display: block; font: 500 var(--text-callout) var(--font-ui);
                  color: var(--label-2); text-transform: none; letter-spacing: 0; margin-top: 1px; }
.checked.stale strong { color: var(--label); text-decoration: underline wavy; }
.summary { font: var(--text-callout) var(--font-ui); color: var(--label-2); margin-bottom: var(--space-7); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--space-5); }

.card {
  background: var(--bg-elevated);
  border: 0.5px solid var(--separator);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  padding: var(--space-6);
  display: flex; gap: var(--space-5);
}
/* Attention is carried by weight and a rule, never by hue. The board reads
   identically in greyscale, which is the test it has to pass. */
.card.attn { background: var(--attn-bg); border-color: var(--border-strong); }

.ringwrap { flex: none; }
svg { display: block; }
.ring-track   { stroke: var(--separator); }
.ring-fill    { stroke: var(--label); }
.ring-unknown { stroke: var(--label-3); stroke-dasharray: 5 7; }
.ring-label   { fill: var(--label); font: 600 var(--text-callout) var(--font-ui); }
.ring-sub     { fill: var(--label-3); font: var(--text-caption) var(--font-ui); }

.body { flex: 1; min-width: 0; }
.name { font: 600 var(--text-title-3) var(--font-ui); letter-spacing: -0.016em; }
.meta { font: var(--text-subhead) var(--font-ui); color: var(--label-3); margin-bottom: var(--space-4); }
.state { font: 600 var(--text-body) var(--font-ui); margin-bottom: 1px; }
.task  { font: var(--text-callout) var(--font-ui); color: var(--label-2); overflow-wrap: anywhere; }
.why   { font: var(--text-caption) var(--font-ui); color: var(--label-3);
         margin-top: var(--space-4); padding-top: var(--space-3);
         border-top: 0.5px solid var(--separator); }
.flag  { display: inline-block; font: var(--text-caption) var(--font-ui); color: var(--label-3);
         border: 0.5px solid var(--separator); border-radius: var(--radius-pill);
         padding: 1px var(--space-3); margin-left: var(--space-3); vertical-align: 1px; }
.note  { margin-top: var(--space-4); padding: var(--space-4) var(--space-5);
         font: var(--text-callout) var(--font-ui); color: var(--label);
         background: var(--bg-sunken); border-radius: var(--radius-control);
         border-left: 2px solid var(--border-strong); }
.err   { background: var(--bg-elevated); border: 0.5px solid var(--border-strong);
         border-radius: var(--radius-card); padding: var(--space-6); font: var(--text-body) var(--font-ui); }
</style>
</head>
<body>
<header>
  <h1>Agent Workforce</h1>
  <div class="checked" id="checked"></div>
</header>
<div class="summary" id="summary">Loading…</div>
<div class="grid" id="grid"></div>

<script>
'use strict';

// Plain words, not internal vocabulary. "rate_limited" is not a thing a person
// should ever have to read.
const STATE_COPY = {
  working:      { label: 'Working',       attn: false },
  needs_you:    { label: 'Needs you',     attn: true  },
  rate_limited: { label: 'Paused',        attn: true  },
  idle:         { label: 'Idle',          attn: false },
  stopped:      { label: 'Not running',   attn: true  },
  unknown:      { label: "Can't tell",    attn: true  },
};

function ring(ctx) {
  const R = 34, C = 2 * Math.PI * R;
  // An unknown ring is drawn dashed with a question mark, never as an empty
  // one. An empty ring reads as "0% used", which reads as the healthiest agent
  // on the board -- the exact failure this whole screen exists to avoid.
  if (ctx.percent === null) {
    const sub = ctx.tokens === null ? 'no reading' : (Math.round(ctx.tokens / 1000) + 'k');
    return `<svg width="86" height="86" viewBox="0 0 86 86" role="img"
              aria-label="Memory: ${ctx.tokens === null ? 'could not be read' : ctx.tokens + ' tokens, fullness unknown'}">
      <circle class="ring-unknown" cx="43" cy="43" r="${R}" fill="none" stroke-width="6"/>
      <text class="ring-label" x="43" y="42" text-anchor="middle">?</text>
      <text class="ring-sub" x="43" y="56" text-anchor="middle">${sub}</text>
    </svg>`;
  }
  const dash = (ctx.percent / 100) * C;
  return `<svg width="86" height="86" viewBox="0 0 86 86" role="img" aria-label="Memory ${ctx.percent}% full">
    <circle class="ring-track" cx="43" cy="43" r="${R}" fill="none" stroke-width="6"/>
    <circle class="ring-fill" cx="43" cy="43" r="${R}" fill="none" stroke-width="6"
            stroke-dasharray="${dash} ${C - dash}" transform="rotate(-90 43 43)"/>
    <text class="ring-label" x="43" y="48" text-anchor="middle">${ctx.percent}%</text>
  </svg>`;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function card(a) {
  const copy = STATE_COPY[a.state] || STATE_COPY.unknown;
  // Provenance deliberately not shown here. It appeared on nearly every card,
  // and a marker that is always present carries no information. The engine
  // still tracks it, and it surfaces where it changes a decision: the dashed
  // unknown ring, and the "we are not telling you it is fine" note.
  const scraped = '';

  const unknownNote = a.state === 'unknown'
    ? '<div class="note">Not the same as idle. We cannot see this one, so we are not telling you it is fine.</div>'
    : '';

  const fullnessNote = a.context.percent === null && a.context.tokens !== null
    ? `<div class="note">We know it is using ${Math.round(a.context.tokens / 1000)}k, but not how much it can hold, so we will not guess how full it is.</div>`
    : (a.context.percent !== null && a.context.percent >= 80
        ? '<div class="note">Nearly full. It will soon forget the earlier part of this conversation, including anything it agreed to do.</div>'
        : '');

  return `<div class="card ${copy.attn ? 'attn' : ''}">
    <div class="ringwrap">${ring(a.context)}</div>
    <div class="body">
      <div class="name">${esc(a.name)}${a.nameDerived ? '' : '<span class="flag" title="We could not find a real name for this one, so this is the machine name">machine name</span>'}</div>
      <div class="meta">${esc([a.role, a.modelName || 'model unknown'].filter(Boolean).join(' · '))}</div>
      <div class="state"><b>${copy.label}</b>${scraped}</div>
      <div class="task">${esc(a.task || 'no task showing')}</div>
      ${unknownNote}${fullnessNote}
      <div class="why">${esc(a.because)}</div>
    </div>
  </div>`;
}

async function tick() {
  const checked = document.getElementById('checked');
  try {
    const res = await fetch('/api/status', { cache: 'no-store' });
    if (!res.ok) throw new Error('status ' + res.status);
    const data = await res.json();

    document.getElementById('grid').innerHTML = data.agents.map(card).join('');

    const c = data.counts;
    const bits = [`${c.total} agents`];
    if (c.needsYou) bits.push(`${c.needsYou} need you`);
    if (c.unknown) bits.push(`${c.unknown} we cannot read`);
    if (c.unknownFullness) bits.push(`${c.unknownFullness} with unknown memory limits`);
    document.getElementById('summary').textContent = bits.join(' · ');

    // The freshness stamp is load-bearing. An ambient board gets trusted
    // passively, and silence reads as "all fine". If this stops updating, the
    // stamp goes stale visibly rather than the board freezing on a happy picture.
    const age = Math.round((Date.now() - new Date(data.checkedAt).getTime()) / 1000);
    checked.className = 'checked' + (age > 30 ? ' stale' : '');
    checked.innerHTML = 'checked<strong>' + (age < 5 ? 'just now' : age + ' seconds ago') + '</strong>';
  } catch (err) {
    checked.className = 'checked stale';
    checked.innerHTML = 'checked<strong>failed</strong>';
    document.getElementById('grid').innerHTML =
      '<div class="err"><b>We cannot read the agents right now.</b><br>' +
      'This board is not saying they are fine, it is saying we cannot see them. (' + esc(err.message) + ')</div>';
  }
}

tick();
setInterval(tick, 5000);
</script>
</body>
</html>
